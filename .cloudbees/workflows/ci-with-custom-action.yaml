apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: CI with custom action
on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      yes:
        type: choice
        options:
          - yes
jobs:
  ci-job:
    steps:
      - uses: docker://alpine/git:latest
        run: |
          git config --global --add safe.directory /cloudbees/workspace
      - name: checkout
        uses: https://github.com/cloudbees-io/checkout@v1
      - name: Build Go app
        uses: docker://golang:1.20
        run: |
          go build -v ./...
      - name: Run tests
        uses: docker://golang:1.20
        run: |
          go test -v ./...
      - name: Run Waggle release notice
        uses: waggle-inc/waggle-actions@main
        with:
          service: dispatch-api
          environment: staging
      - name: Run Waggle release notice
        uses: waggle-inc/waggle-actions@main
        with:
          service: dispatch-api
          environment: staging
