apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: CI with custom action
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  ci-job:
    steps:
      - name: checkout
        uses: https://github.com/cloudbees-io/checkout@v2
      - name: Build Go app
        uses: docker://golang:1.20
        run: |
          go build -v ./...
      - name: Run tests
        uses: docker://golang:1.20
        run: |
          go test -v ./...
  
  staging-approval:
    needs: ci-job
    timeout-minutes: 4320
    with:
      approvers: "mbedford@cloudbees.com"
      instructions: "Please approve deployment to staging environment"
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
  
  deploy-to-staging:
    needs: staging-approval
    steps:
      - name: checkout
        uses: https://github.com/cloudbees-io/checkout@v2
      - name: Run Waggle release notice
        uses: waggle-inc/waggle-actions@main
        with:
          service: dispatch-api
          environment: staging
