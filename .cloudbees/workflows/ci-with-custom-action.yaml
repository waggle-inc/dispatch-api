apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: CI with custom action
on:
  push:
    branches:
      - main
jobs:
  ci-job:
    steps:
      - name: checkout
        uses: https://github.com/cloudbees-io/checkout@v2
      - name: Build Go app
        uses: docker://golang:1.20
        run: |
          go build -v ./...
      - name: Run tests
        uses: docker://golang:1.20
        run: |
          go test -v ./...
